name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the sitemap's <lastmod> dates come from git.
          fetch-depth: 0

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + client build + SSR build + prerender (parses resume.tex)
      - run: pnpm run build

      - name: Check generated output
        run: |
          set -e
          for f in index.html resume.html projects.html 404.html llms.txt llms-full.txt resume.md robots.txt sitemap.xml; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          # resume.tex content must be pre-rendered into the static HTML,
          # with no raw LaTeX leaking through the parser
          grep -q 'Professional Experience' dist/resume.html
          if grep -nE '\\[a-zA-Z]+\{|\$\\' dist/index.html dist/resume.html dist/resume.md dist/llms.txt; then
            echo "::error::raw LaTeX found in generated output"; exit 1
          fi

      - name: Check performance budgets
        run: |
          set -e
          # Main JS entry (loaded on every page). Heavy, page-specific code such
          # as the gallery carousel belongs in a lazily imported chunk.
          entry=$(grep -oE '<script type="module"[^>]* src="[^"]+"' dist/index.html | head -n1 | sed -E 's/.* src="\/?([^"]+)"/\1/')
          main_js="dist/$entry"
          test -n "$entry" && test -f "$main_js" || { echo "::error::main JS entry not found in dist/index.html"; exit 1; }
          size=$(wc -c < "$main_js")
          echo "main JS: $size bytes"
          if [ "$size" -gt 350000 ]; then
            echo "::error::main JS bundle is $size bytes (budget 350000)"; exit 1
          fi
          # Every <img> needs width/height to avoid layout shift.
          missing=$(grep -rhoE '<img [^>]*>' dist --include='*.html' | grep -vE ' width=.* height=| height=.* width=' || true)
          if [ -n "$missing" ]; then
            echo "::error::<img> without width/height:"; echo "$missing"; exit 1
          fi
          # Screenshots should be WebP (run scripts/optimize-images.sh).
          large=$(find dist -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) ! -name 'opengraph.jpg' -size +200k)
          if [ -n "$large" ]; then
            echo "::error::unoptimized images (run scripts/optimize-images.sh):"; echo "$large"; exit 1
          fi
