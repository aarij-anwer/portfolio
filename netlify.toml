[build]
  command = "pnpm run build"
  publish = "dist"

# Every route is pre-rendered to its own HTML file (see scripts/prerender.mjs),
# so there is no SPA catch-all rewrite: unknown paths get dist/404.html with a
# real 404 status instead of a soft-404 copy of the home page.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
